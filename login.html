<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk - Antrian Rumah Sakit</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="module" src="dist/login.js" defer></script>
</head>
<body>
  <div class="login-container">
    <img class="logo" src="images/logo.png" alt="Logo" />
    <h2>Masuk</h2>
    <p>
      Halaman ini untuk mengakses Dashboard Admin dan Panel Operator.
      Layar Kiosk tidak memerlukan login.
    </p>

    <div id="error-message" class="error-message" role="alert" hidden></div>

    <form id="login-form" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Masukkan username" autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" />
      </div>

      <button type="submit" id="submit-btn">Masuk</button>
    </form>
  </div>
</body>
</html>
