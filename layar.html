<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layar Antrian Rumah Sakit</title>
    <link rel="icon" type="image/png" href="images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/layar-ambil.css">
    <script type="module" src="dist/layar.js" defer></script>
</head>
<body>
    <nav class="navbar">
        <a class="brand" href="ambil-antrian.html">
            <img
                class="logo"
                src="images/logo.png"
                alt="Logo rumah sakit"
                width="42"
                height="42"
            >
            <div class="brand-text">
                <h1>Antrian Rumah Sakit</h1>
                <p>Layanan antrian digital</p>
            </div>
        </a>

        <div class="navbar-aksi">
            <div class="grup-navigasi">
                <a class="tautan-nav" href="ambil-antrian.html">
                    Ambil Antrian
                </a>
                <a
                    class="tautan-nav aktif"
                    href="layar.html"
                    aria-current="page"
                >
                    Layar Antrian
                </a>
            </div>

            <button id="btn-logout" type="button">Keluar</button>
        </div>
    </nav>

    <main class="container">
        <header class="header">
            <h2>Antrian Rumah Sakit</h2>
            <p>Informasi nomor antrian saat ini</p>
        </header>

        <section
            id="daftar-layanan"
            class="daftar-layanan"
            aria-live="polite"
        >
            <p>Memuat informasi antrian...</p>
        </section>

        <button id="fullscreen-btn" type="button">
            Tampilkan Layar Penuh
        </button>
    </main>
</body>
</html>
