<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Dashboard Admin</title>
        <link rel="icon" type="image/png" href="images/logo.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/index.css">
        <script type="module" src="dist/index.js" defer></script>
    </head>

    <body>
        <header class="navbar">
            <div class="brand">
                <img class="logo" src="images/logo.png" alt="Logo rumah sakit" width="46" height="46">
                <div class="navbar-title">
                    <h1>Dashboard Admin</h1>
                    <p class="subtitle">Reset setiap hari agar penomoran antrian mulai dari awal.</p>
                </div>
            </div>

            <div class="navbar-aksi">
                <div class="info-user">
                    <span id="nama-user"></span>
                    <span id="role-user"></span>
                </div>
                <button id="btn-reset" type="button">Reset Antrian</button>
                <button id="btn-logout" type="button">Keluar</button>
            </div>
        </header>

        <main class="layout">
            <section class="panel" id="panel-jenis">
                <h2>Jenis antrian</h2>

                <form id="form-jenis">
                    <div class="field">
                        <label for="input-kode">Kode</label>
                        <input
                            id="input-kode"
                            type="text"
                            placeholder="C"
                            maxlength="1"
                            required
                        >
                    </div>
                    <div class="field">
                        <label for="input-nama">Nama</label>
                        <input
                            id="input-nama"
                            type="text"
                            placeholder="Contoh: Farmasi"
                            required
                        >
                    </div>
                    <button id="btn-tambah" type="submit">Tambah</button>
                </form>

                <p id="pesan-jenis" class="pesan"></p>

                <ul id="daftar-jenis"></ul>
            </section>

            <section class="panel" id="panel-tiket">
                <h2>Terbitkan tiket</h2>

                <form id="form-tiket">
                    <div class="field">
                        <label for="select-jenis">Jenis antrian</label>
                        <select id="select-jenis" required>
                            <option value="">Pilih jenis antrian</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="select-prioritas">Prioritas</label>
                        <select id="select-prioritas">
                            <option value="Normal" selected>Normal</option>
                            <option value="Lansia">Lansia</option>
                            <option value="Disabilitas">Disabilitas</option>
                            <option value="VIP">VIP</option>
                        </select>
                    </div>
                    <button id="btn-terbitkan" type="submit">Terbitkan</button>
                </form>

                <p id="pesan-tiket" class="pesan"></p>

                <div id="daftar-tiket"></div>
            </section>
        </main>
    </body>
</html>
